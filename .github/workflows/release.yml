name: Build Windows release

on:
  push:
    tags:
    - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - name: Check out source
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Build portable package
      shell: pwsh
      run: .\package-windows.ps1

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: pwsh
      run: >-
        gh release create $env:GITHUB_REF_NAME .\dist\ModelsCompare.exe .\dist\modelscompare-windows-x64.zip --verify-tag --generate-notes --title "ModelsCompare $env:GITHUB_REF_NAME"
